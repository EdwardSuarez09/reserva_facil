<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Test Modal</title>
  <style>
    .modal {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: rgba(0,0,0,0.5);
      display: none;
      z-index: 1000;
    }
    
    .modal-content {
      margin: 50px auto;
      background: white;
      padding: 20px;
      width: 80%;
      max-width: 500px;
      border-radius: 8px;
    }
    
    .modal-close {
      float: right;
      font-size: 24px;
      font-weight: bold;
      cursor: pointer;
      background: none;
      border: none;
    }
    
    .btn {
      padding: 10px 20px;
      margin: 10px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <h1>Test de Modal</h1>
  
  <button onclick="abrirModal()" class="btn">Abrir Modal</button>
  
  <!-- Modal -->
  <div id="test-modal" class="modal">
    <div class="modal-content">
      <button class="modal-close" onclick="cerrarModal()">&times;</button>
      <h3>Modal de Prueba</h3>
      <p>Este es un modal de prueba para verificar que funcione correctamente.</p>
      <button onclick="cerrarModal()" class="btn">Cerrar</button>
    </div>
  </div>

  <script>
    console.log('Script cargado');
    
    function abrirModal() {
      console.log('Abriendo modal...');
      document.getElementById('test-modal').style.display = 'block';
    }
    
    function cerrarModal() {
      console.log('Cerrando modal...');
      document.getElementById('test-modal').style.display = 'none';
    }
    
    // Cerrar modal al hacer clic fuera
    document.addEventListener('click', function(event) {
      const modal = document.getElementById('test-modal');
      if (event.target === modal) {
        cerrarModal();
      }
    });
    
    // Verificar si se está abriendo automáticamente
    document.addEventListener('DOMContentLoaded', function() {
      console.log('DOM cargado - NO se debe abrir modal automáticamente');
    });
  </script>
</body>
</html>
